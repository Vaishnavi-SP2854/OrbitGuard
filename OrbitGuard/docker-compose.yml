services:
  pipeline:
    build: .
    command: python -m src.run_pipeline --hours 24 --step 10
    volumes: [ "./data:/app/data" ]

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports: [ "8000:8000" ]
    volumes: [ "./data:/app/data" ]
    depends_on: [ pipeline ]

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: [ "8501:8501" ]
    volumes: [ "./data:/app/data" ]
    depends_on: [ pipeline ]
